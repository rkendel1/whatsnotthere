<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Website X-Ray</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; width: 520px; min-height: 180px; color: #172033; background: #f7f8fb; }
      header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: #111827; color: white; }
      header strong { font-size: 14px; letter-spacing: .01em; }
      button, select { font: inherit; }
      button { border: 1px solid #cbd2df; border-radius: 7px; padding: 7px 11px; background: white; color: #172033; cursor: pointer; }
      button:hover { background: #f0f3f8; }
      button:disabled { cursor: default; opacity: .55; }
      #scan { border-color: #5368ed; background: #6376f1; color: white; font-weight: 650; }
      #output { max-height: 520px; overflow-y: auto; padding: 12px; }
      .modes { display: grid; grid-template-columns: 1fr 1fr; padding: 6px; background: #e9ecf2; }
      .modes button { border: 0; padding: 7px; color: #667085; background: transparent; font-size: 11px; font-weight: 650; }
      .modes button.active { color: #172033; background: white; box-shadow: 0 1px 3px rgba(16,24,40,.12); }
      .report-summary { margin: 0 0 10px; color: #667085; font-size: 12px; }
      .dataset { background: white; border: 1px solid #e1e5ed; padding: 14px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
      .dataset-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .dataset h2 { font-size: 17px; margin: 0; }
      .badge { flex: none; padding: 3px 7px; border-radius: 999px; background: #eaf7ef; color: #18794e; font-size: 10px; font-weight: 700; text-transform: uppercase; }
      .badge.low { background: #f1f2f4; color: #667085; }
      .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0; }
      .metric { padding: 8px; border-radius: 7px; background: #f6f7fa; }
      .metric strong { display: block; font-size: 15px; }
      .metric span { color: #667085; font-size: 10px; }
      .meta { color: #667085; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .fields { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
      .field { padding: 3px 6px; border-radius: 5px; background: #eef1ff; color: #4050a8; font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .visibility-summary { margin-top: 8px; padding: 7px 8px; border-radius: 6px; background: #fff8e7; color: #805b10; font-size: 10px; }
      details { margin-top: 11px; font-size: 12px; }
      summary { cursor: pointer; font-weight: 650; }
      .table-wrap { overflow: auto; max-height: 230px; margin-top: 8px; border: 1px solid #e1e5ed; border-radius: 7px; }
      table { border-collapse: collapse; width: 100%; font-size: 11px; background: white; }
      th { position: sticky; top: 0; z-index: 1; background: #f3f5f8; text-align: left; color: #475467; }
      th, td { max-width: 190px; padding: 7px 8px; border-bottom: 1px solid #edf0f4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      td.number { text-align: right; font-variant-numeric: tabular-nums; }
      .actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 11px; }
      .actions select { border: 1px solid #cbd2df; border-radius: 7px; padding: 7px; background: white; }
      .primary-action { background: #172033; border-color: #172033; color: white; }
      .secondary-group { margin: 4px 2px 10px; }
      .secondary-group > summary { color: #667085; padding: 7px 2px; }
      .error { padding: 0 12px; color: #b42318; font-size: 12px; }
      .empty-state { margin: 4px; padding: 20px; text-align: center; background: white; border: 1px solid #e1e5ed; border-radius: 10px; }
      .empty-state h2 { margin: 0 0 8px; font-size: 16px; }
      .empty-state p { margin: 5px auto 14px; max-width: 410px; color: #667085; font-size: 12px; line-height: 1.5; }
      .empty-state .empty-hint { color: #344054; }
      .ghost-panel { margin-bottom: 12px; padding: 15px; border-radius: 11px; color: #f8f5ff; background: linear-gradient(145deg,#26183f,#151827); box-shadow: 0 7px 18px rgba(29,18,49,.18); }
      .ghost-title { display: flex; align-items: center; justify-content: space-between; }
      .ghost-title h2 { margin: 0; font-size: 18px; }
      .ghost-count { padding: 4px 8px; border-radius: 999px; color: #eadcff; background: rgba(174,126,255,.18); font-size: 10px; font-weight: 700; }
      .ghost-definition { margin: 6px 0 12px; color: #c9c1d7; font-size: 11px; }
      .ghost-comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
      .ghost-comparison div { padding: 9px; border: 1px solid rgba(255,255,255,.09); border-radius: 8px; background: rgba(255,255,255,.05); }
      .ghost-comparison strong { display: block; font-size: 20px; }
      .ghost-comparison span { color: #bdb5ca; font-size: 10px; }
      .ghost-categories { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
      .ghost-categories span { padding: 3px 6px; border-radius: 5px; background: rgba(255,255,255,.08); color: #d7d0e1; font-size: 9px; }
      .ghost-disclosure { margin-top: 12px; }
      .ghost-disclosure > summary { color: #d7b7ff; letter-spacing: .05em; }
      .ghost-item { margin-top: 8px; padding: 9px; border-radius: 7px; color: #172033; background: #fff; }
      .ghost-item > div:first-child { display: flex; justify-content: space-between; gap: 8px; }
      .ghost-confidence { color: #6941c6; font-size: 9px; white-space: nowrap; }
      .ghost-evidence, .ghost-path { margin-top: 4px; color: #667085; font-size: 9px; }
      .ghost-item code { display: block; margin-top: 6px; padding: 5px; overflow: hidden; text-overflow: ellipsis; color: #5925dc; background: #f4f3ff; font-size: 9px; white-space: nowrap; }
      .ghost-caveat { color: #aaa1b8; font-size: 9px; line-height: 1.4; }
      .guide-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
      .guide-header select { min-width: 240px; max-width: 330px; border: 1px solid #cbd2df; border-radius: 7px; padding: 7px; background: white; }
      .guide-summary { margin-bottom: 10px; padding: 12px; border-radius: 9px; color: white; background: #26354f; }
      .guide-summary strong { display: block; font-size: 20px; }
      .guide-summary span { color: #cbd5e1; font-size: 10px; }
      .guide-exports { display: flex; gap: 5px; }
      .guide-exports button { padding: 6px 8px; font-size: 10px; }
      .changes { margin-bottom: 10px; padding: 9px; border: 1px solid #ddd6fe; border-radius: 8px; color: #5b21b6; background: #f5f3ff; font-size: 10px; }
      .endpoint { margin-bottom: 8px; border: 1px solid #e1e5ed; border-radius: 9px; background: white; overflow: hidden; }
      .endpoint > summary { display: flex; align-items: center; gap: 8px; padding: 11px; list-style: none; }
      .endpoint > summary::-webkit-details-marker { display: none; }
      .method { padding: 3px 5px; border-radius: 4px; color: #175cd3; background: #eff8ff; font: 700 9px ui-monospace,monospace; }
      .endpoint-path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 11px ui-monospace,monospace; }
      .endpoint-count { margin-left: auto; color: #667085; font-size: 9px; white-space: nowrap; }
      .endpoint-body { padding: 0 11px 11px; }
      .endpoint-purpose { margin: 0 0 8px; color: #475467; font-size: 11px; }
      .endpoint-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 8px; }
      .endpoint-meta div { padding: 6px; background: #f7f8fa; font-size: 9px; }
      .schema-tree, .evidence-block { max-height: 180px; overflow: auto; padding: 8px; border-radius: 6px; background: #111827; color: #d1d5db; font: 9px ui-monospace,monospace; white-space: pre-wrap; }
      .endpoint-actions { display: flex; gap: 5px; margin-top: 8px; }
      .endpoint-actions button { font-size: 9px; }
      .catalog-empty { padding: 30px; text-align: center; color: #667085; }
    </style>
  </head>
  <body>
    <header><strong>Website X-Ray</strong><button id="scan">Extract Dataset</button></header>
    <nav class="modes"><button id="mode-xray" class="active">X-Ray</button><button id="mode-guide">API Field Guide</button></nav>
    <div id="error" class="error"></div>
    <div id="output">No report yet.</div>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
